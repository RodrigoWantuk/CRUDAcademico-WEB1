<style>
    /* Reset básico */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        width: 100%;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    /* Barra Superior Azul Escuro */
    .top-info-bar {
        background-color: #2c3e50;
        color: white;
        padding: 10px 0;
        font-size: 0.9rem;
    }

    .top-info-bar .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
    }

    .top-info-bar .info-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    .top-info-bar p {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Header Vermelho */
    .main-header {
        background-color: #dc3545;
        padding: 12px 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .main-header .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
    }

    .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    /* Brand */
    .brand {
        color: white;
        text-decoration: none;
        font-size: 1.5rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
    }

    .brand:hover {
        color: white;
        text-decoration: none;
    }

    .brand i {
        font-size: 1.6rem;
    }

    /* Menu Toggle Button */
    .menu-toggle {
        display: none;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1.3rem;
    }

    .menu-toggle:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    /* Menu de Navegação */
    .nav-menu {
        display: flex;
        list-style: none;
        gap: 10px;
        margin: 0;
        padding: 0;
    }

    .nav-menu li {
        margin: 0;
    }

    .nav-menu a {
        color: white;
        background-color: rgba(255, 255, 255, 0.15);
        text-decoration: none;
        font-weight: 500;
        padding: 10px 18px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        white-space: nowrap;
        cursor: pointer;
    }

    .nav-menu a:hover {
        background-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
        text-decoration: none;
    }

    .nav-menu a.active {
        background-color: rgba(255, 255, 255, 0.35);
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .nav-menu i {
        font-size: 1rem;
    }

    /* Área de Conteúdo */
    .main-content {
        flex: 1;
        padding: 30px 15px;
        background-color: #f5f5f5;
        width: 100%;
    }

    .main-content .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
    }

    .content-card {
        background: white;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        border: 2px solid #1976d2;
        min-height: 400px;
        width: 100%;
    }

    /* Footer */
    .main-footer {
        background-color: #2c3e50;
        color: #95a5a6;
        padding: 20px 15px;
        text-align: center;
        margin-top: auto;
    }

    .footer-divider {
        width: 200px;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
        margin: 0 auto 15px;
    }

    .main-footer p {
        margin: 0;
        font-size: 0.9rem;
    }

    /* Responsividade */
    @media (max-width: 991px) {
        .menu-toggle {
            display: block;
        }

        .nav-menu {
            display: none;
            width: 100%;
            flex-direction: column;
            margin-top: 15px;
        }

        .nav-menu.active {
            display: flex;
        }

        .nav-menu a {
            width: 100%;
        }

        .header-content {
            flex-wrap: wrap;
        }
    }

    @media (max-width: 767px) {
        .top-info-bar .info-content {
            justify-content: center;
            text-align: center;
        }

        .brand {
            font-size: 1.3rem;
        }

        .content-card {
            padding: 25px;
        }
    }

    @media (max-width: 575px) {
        .top-info-bar {
            font-size: 0.8rem;
        }

        .brand {
            font-size: 1.2rem;
        }

        .brand i {
            font-size: 1.3rem;
        }

        .content-card {
            padding: 20px;
        }
    }
</style>

<!-- Barra Superior -->
<div class="top-info-bar">
    <div class="container">
        <div class="info-content">
            <p>
                <i class="fas fa-graduation-cap"></i>
                <span>Trabalho de Desenvolvimento WEB I</span>
            </p>
            <p>
                <i class="fas fa-user"></i>
                <span>Aluno: Rodrigo Wantuk (059.197.089-99)</span>
            </p>
        </div>
    </div>
</div>

<!-- Header Principal -->
<header class="main-header">
    <div class="container">
        <div class="header-content">
            <a class="brand" routerLink="/">
                <i class="fas fa-university"></i>
                <span>Sistema Acadêmico</span>
            </a>

            <button class="menu-toggle" (click)="toggleMenu()">
                <i class="fas fa-bars"></i>
            </button>

            <ul class="nav-menu" [class.active]="menuActive">
                <li>
                    <a routerLink="/alunos/listar" routerLinkActive="active" (click)="closeMenu()">
                        <i class="fas fa-users"></i>
                        <span>Listar Alunos</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/alunos/cadastrar" routerLinkActive="active" (click)="closeMenu()">
                        <i class="fas fa-user-plus"></i>
                        <span>Cadastrar Aluno</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/cursos/listar" routerLinkActive="active" (click)="closeMenu()">
                        <i class="fas fa-book"></i>
                        <span>Listar Cursos</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/cursos/cadastrar" routerLinkActive="active" (click)="closeMenu()">
                        <i class="fas fa-plus-circle"></i>
                        <span>Cadastrar Curso</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- Conteúdo Principal -->
<main class="main-content">
    <div class="container">
        <div class="content-card">
            <router-outlet></router-outlet>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="main-footer">
    <div class="footer-divider"></div>
    <p>CRUD Acadêmico © 2025
      <br />
      Rodrigo Wantuk - CPF: 059.197.089-99
    </p>
</footer>
