<!-- listar-aluno.html -->
<div class="card listar-aluno-card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="mb-0">Lista de Alunos</h3>
    <a class="btn btn-sm btn-primary" routerLink="/alunos/cadastrar">
      <i class="fas fa-plus"></i> Novo
    </a>
  </div>

  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-striped mb-0 align-middle">
        <thead class="table-head">
          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Data de Nascimento</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let aluno of alunos">
            <td>{{ aluno.nome }}</td>
            <td>{{ aluno.cpf }}</td>
            <td>{{ aluno.email }}</td>
            <td>{{ aluno.dataNascimento | date:'dd/MM/yyyy' }}</td>
            <td class="text-center">
              <a
                class="btn btn-sm btn-outline-secondary me-1"
                [routerLink]="['/alunos/editar', aluno.id]"
                title="Editar"
              >
                <i class="fas fa-edit"></i>
              </a>

              <button
                class="btn btn-sm btn-outline-danger"
                (click)="remover($event, aluno)"
                title="Excluir"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>

          <tr *ngIf="alunos.length === 0">
            <td colspan="5" class="text-center p-3 text-muted">
              Nenhum aluno encontrado.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
